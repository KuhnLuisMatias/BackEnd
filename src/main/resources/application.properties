spring.datasource.url = jdbc:mysql://REPLACE_ME_DB_USER:REPLACE_ME_DB_PASSWORD@REPLACE_ME_DB_HOST.clever-cloud.com:3306/REPLACE_ME_DB_NAME
 #LOCAL :mysql://localhost:3306/crud?useSSL=false&serverTimezone=UTC&useLegacyDateTimeCode=false

# nombre de usuario y contraseña
spring.datasource.username = REPLACE_ME_DB_USER
spring.datasource.password = REPLACE_ME_DB_PASSWORD

# mostrar sentencias SQL en la consola
spring.jpa.show-sql = true

# actualizar base de datos y crear entidades
spring.jpa.hibernate.ddl-auto = update

# hibernate genera SQL optimizado
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# security
jwt.secret = ${JWT_SECRET}
jwt.expiration = 36000

